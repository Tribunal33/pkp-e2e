#!/usr/sbin/nft -f
# The plugin sandbox's egress rule (harness.md "The plugin sandbox"):
# every packet a socket of the sandbox user opens is logged and dropped,
# loopback included, unless it answers a connection made to it (the
# published pod ports Playwright drives) or goes to an address
# `plugin-egress allow` put in the sets for a review that asked for it.
# Installed to /etc/plugin-sandbox/nft.conf by sandbox/vm/setup.sh and
# loaded at boot by plugin-sandbox-firewall.service. Only this table is
# touched: ufw's tables stay as they are.

table inet plugin_sandbox
delete table inet plugin_sandbox

table inet plugin_sandbox {
    set allowed4 {
        type ipv4_addr
        flags timeout
    }

    set allowed6 {
        type ipv6_addr
        flags timeout
    }

    # Only packets a sandbox-user socket sends are judged; everything else,
    # the kernel's own packets with no socket included (RSTs, ICMP, IPv6
    # neighbour discovery), passes untouched.
    chain output {
        type filter hook output priority filter; policy accept;
        meta skuid "e2e-plugin" jump sandbox
    }

    chain sandbox {
        ct state established,related accept
        ip daddr @allowed4 accept
        ip6 daddr @allowed6 accept
        limit rate 20/second burst 100 packets log prefix "plugin-egress: drop " level info
        drop
    }
}
