; The sandbox's PHP settings. allow_url_fopen stays On, as on most
; installs: a plugin's remote reads must reach the network layer, where the
; host's egress rule logs and drops them, instead of failing silently here.
memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 64M
post_max_size = 64M
display_errors = Off
log_errors = On
error_log = /sandbox/log/php-error.log
error_reporting = E_ALL
date.timezone = UTC
